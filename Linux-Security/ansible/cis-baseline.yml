---
- name: CIS Level 1 Baseline for Zero-Trust Tier 1 Server
  hosts: all
  become: yes
  tasks:
    - name: Hardening SSH - Disable Root Login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSHD

    - name: Hardening SSH - Disable Password Authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSHD

    - name: Secure /tmp directory
      mount:
        path: /tmp
        src: tmpfs
        fstype: tmpfs
        opts: rw,nosuid,nodev,noexec,relatime
        state: mounted

    - name: Install auditd for privileged execution logging
      apt:
        name:
          - auditd
          - audispd-plugins
        state: present
        update_cache: yes

    - name: Ensure auditd is enabled and started
      service:
        name: auditd
        enabled: yes
        state: started

    - name: Simulate Splunk Universal Forwarder Installation
      file:
        path: /opt/splunkforwarder
        state: directory
        mode: '0755'

    - name: Configure inputs.conf for Auditd monitoring
      copy:
        dest: /opt/splunkforwarder/inputs.conf
        content: |
          [monitor:///var/log/audit/audit.log]
          disabled = false
          index = security
          sourcetype = linux_audit
  handlers:
    - name: Restart SSHD
      service:
        name: sshd
        state: restarted
